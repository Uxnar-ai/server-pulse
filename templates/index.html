<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>pulse · 服务器脉搏</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#232a33; --fg:#e6edf3;
    --dim:#8b949e; --accent:#3fb950; --warn:#d29922; --bad:#f85149;
    --cpu:#58a6ff; --mem:#bc8cff; --disk:#d29922; --net:#39c5cf;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .wrap{max-width:900px;margin:0 auto;padding:28px 20px 60px}
  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
         border-bottom:1px solid var(--line);padding-bottom:14px}
  h1{font-size:20px;margin:0;letter-spacing:.5px}
  h1 .en{color:var(--dim);font-weight:400}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);
       display:inline-block;margin-right:6px;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .meta{margin-left:auto;color:var(--dim);font-size:12px}
  .sub{color:var(--dim);font-size:12px;margin:10px 0 22px}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
  .card .lab{color:var(--dim);font-size:11px;letter-spacing:.6px;text-transform:uppercase}
  .card .val{font-size:26px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
  .card .unit{font-size:12px;color:var(--dim);font-weight:400;margin-left:2px}
  .chart{background:var(--panel);border:1px solid var(--line);border-radius:8px;
         padding:12px 14px 8px;margin-bottom:12px}
  .chart .top{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
  .chart .name{font-size:13px}
  .chart .nums{margin-left:auto;color:var(--dim);font-size:11px;
               font-variant-numeric:tabular-nums}
  svg{display:block;width:100%;height:120px}
  .empty{color:var(--dim);font-size:12px;padding:36px 0;text-align:center}
  footer{margin-top:26px;color:var(--dim);font-size:11px;
         border-top:1px solid var(--line);padding-top:12px;line-height:1.9}
  footer b{color:var(--fg);font-weight:500}
  @media(max-width:640px){.cards{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>脉 <span class="en">pulse</span></h1>
    <span class="meta"><span class="dot"></span>采集中 · {{ st.now }}</span>
  </header>
  <p class="sub">这台机器自己的心电图。每分钟读一次 <code>/proc</code> 与 <code>statvfs</code>，
     写进 SQLite，这里画最近 {{ st.hours }} 小时。</p>

  <div class="cards">
    <div class="card"><div class="lab">CPU 占用</div>
      <div class="val" id="v-cpu">—<span class="unit">%</span></div></div>
    <div class="card"><div class="lab">内存</div>
      <div class="val" id="v-mem">—<span class="unit">%</span></div></div>
    <div class="card"><div class="lab">磁盘 /</div>
      <div class="val" id="v-disk">—<span class="unit">%</span></div></div>
    <div class="card"><div class="lab">负载 1m</div>
      <div class="val" id="v-load">—</div></div>
  </div>

  <div id="charts"></div>

  <footer>
    采样间隔 <b>{{ st.interval }}s</b> · 保留 <b>{{ st.keep_days}}</b> 天 ·
    当前窗口 <b>{{ st.count }}</b> 个点 · 开机 <b>{{ st.uptime }}</b><br>
    纯手写 SVG，零前端依赖；除 Flask 外不装任何库。
  </footer>
</div>

<script>
const FIELDS = [
  {key:'cpu',  name:'CPU 占用',  unit:'%',    color:'var(--cpu)',  max:100, floor:8},
  {key:'mem',  name:'内存占用',  unit:'%',    color:'var(--mem)',  max:100, floor:20},
  {key:'load1',name:'负载 (1 分钟均值)', unit:'', color:'var(--disk)', max:0},
  {key:'rx',   name:'网络下行',  unit:'KB/s', color:'var(--net)',  max:0},
  {key:'tx',   name:'网络上行',  unit:'KB/s', color:'#ffa657',     max:0},
];

function fmt(v){
  if(v===null||v===undefined) return '—';
  return v>=100 ? Math.round(v) : v.toFixed(1);
}

function drawChart(box, data, f){
  const W=720, H=120, PT=8, PB=6;
  const vals = data.map(d=>d[f.key]).filter(v=>v!==null&&v!==undefined);
  if(vals.length===0){
    box.innerHTML = '<div class="empty">这一段还没有采样</div>';
    return;
  }
  const peak = Math.max(...vals);
  // 百分比图给一个下限，避免全程贴着底部看不见形状
  const maxVal = f.max ? Math.min(f.max, Math.max(f.floor || 10, peak * 1.35))
                       : Math.max(1, peak * 1.15);
  const n = data.length;
  const t0 = data[0].ts, t1 = data[n-1].ts;
  const span = Math.max(1, t1-t0);
  const px = (i,d) => {
    if(n===1) return W/2;
    return ((d.ts - t0)/span) * W;
  };
  const py = v => PT + (1 - Math.min(1, v/maxVal)) * (H-PT-PB);

  let pts=[], area='';
  data.forEach((d,i)=>{ pts.push(`${px(i,d).toFixed(1)},${py(d[f.key]??0).toFixed(1)}`); });
  area = `M0,${H-PB} L` + pts.join(' L') + ` L${W},${H-PB} Z`;

  const grid = [0.25,0.5,0.75].map(r=>{
    const y = (PT + r*(H-PT-PB)).toFixed(1);
    return `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#232a33" stroke-width="1"/>`;
  }).join('');

  const last = vals[vals.length-1];
  const mx = Math.max(...vals), mn = Math.min(...vals);
  const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
  const gid = 'g-'+f.key;

  box.innerHTML = `
    <div class="chart">
      <div class="top">
        <span class="name">${f.name}</span>
        <span class="nums">
          现 ${fmt(last)}${f.unit} · 均 ${fmt(avg)} · 峰 ${fmt(mx)} · 谷 ${fmt(mn)} · ${n} 点
        </span>
      </div>
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${f.color}" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="${f.color}" stop-opacity="0.02"/>
        </linearGradient></defs>
        ${grid}
        <path d="${area}" fill="url(#${gid})"/>
        <polyline points="${pts.join(' ')}" fill="none" stroke="${f.color}"
                  stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
    </div>`;
}

async function tick(){
  try{
    const r = await fetch('/api/recent?hours=' + HOURS);
    const st = await r.json();
    const s = st.stats;
    document.getElementById('v-cpu').innerHTML  = fmt(s.cpu.last)  + '<span class="unit">%</span>';
    document.getElementById('v-mem').innerHTML  = fmt(s.mem.last)  + '<span class="unit">%</span>';
    document.getElementById('v-disk').innerHTML = fmt(s.disk.last) + '<span class="unit">%</span>';
    document.getElementById('v-load').textContent = fmt(s.load1.last);
    const box = document.getElementById('charts');
    if(box.dataset.built !== '1'){
      box.innerHTML = FIELDS.map(f=>`<div id="c-${f.key}"></div>`).join('');
      box.dataset.built = '1';
    }
    FIELDS.forEach(f=>drawChart(document.getElementById('c-'+f.key), st.series, f));
  }catch(e){ console.error(e); }
}
const HOURS = {{ st.hours }};
tick();
setInterval(tick, 60000);
</script>
</body>
</html>
